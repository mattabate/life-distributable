<!doctype html>
<!--
  Console render harness — the console's "look at it" lane for states the live
  hub does not happen to be in right now, and before setup, with no hub at all.

  The problem it solves: `make web-shot` photographs the real hub,
  so a page whose whole point is a pending approval, or a goal editor, can only
  be seen by first creating a real proposal — which puts a fake card on your
  board and pushes your phone. This page loads THIS tree's app.css and app.js
  (?web=) but replaces `fetch` with a fixture table, so any view can be drawn
  in any state without touching your data. Nothing here ships: it is not under
  hub/internal/server/web and so is not embedded in the binary.

  Usage: make web-preview ROUTE='#/calendar'   → ops/logs/web/preview.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>console preview (fixtures)</title>
<script>
  const params = new URLSearchParams(location.search);
  // ?web= draws THIS tree's console (file://…/hub/internal/server/web); ?fixtures=
  // answers any route FIX lacks from shared/fixtures (hub JSON, `make generate`).

  const FIXDIR = params.get('fixtures') || '';

  const TRIP = 'plan-the-spring-trip-a1b2';

        outcomes: [{ value: 'done', label: 'Decided' }, { value: '', label: 'Reply' }] },
      // An item with steps: each row's Did it · Skip · Reply stages on the
      // bar; one is already closed.
      { id: 'cal-0004', cal_id: 'cal-0004', title: 'Do the morning routine', state: 'active', created_at: iso(20), kind: 'physical',
        surface: 'any', thread_id: TRIP, thread_title: 'Plan the spring trip',
        outcomes: [{ value: 'done', label: 'Done' }, { value: 'wont', label: "Won't do" }, { value: '', label: 'Reply' }],

          { n: 3, title: 'Water the plants', state: 'open', mark: 'todo' }] },

        { n: 3, title: 'Water the plants', state: 'open', mark: 'todo' }] },

      { id: 2, thread_id: TRIP, role: 'claude', ts: iso(30), run_id: 'r1', text: 'Two fit. The lake cabin is $480 for two nights and refundable; booking it is a money step, so it is on your board.', cost_usd: 1.42 },

        replies: [{ ref: 'step:cal-0004.1', outcome: 'done', label: 'Did it' }] },
    ],
    [`/threads/${TRIP}/steps`]: [],
    [`/threads/${TIDY}`]: { id: TIDY, title: 'Tidy the weekly digest', status: 'idle', model: 'claude-fable-5-1', cost_usd: 0.31, last_message_at: iso(6) },
    [`/threads/${TIDY}/messages`]: [

    ],

    [`/threads/${TIDY}/events`]: [],
    [`/threads/${TRIP}/events`]: [],
    '/prompts': [],
    '/recs': { recs: [
      { id: 'rec-11aa22bb', status: 'proposed', open: true, title: 'Book before the spring rate ends on Friday', thread_id: TRIP, message_id: 2,
        because: 'The same nights go up to **$560** after Friday.', domain: 'travel', kind: 'buy', cost_label: '$480', cost_cents: 48000,
        model: 'claude-fable-5-1', created_at: iso(28),
        outcomes: [{ value: 'accepted', label: 'Accept' }, { value: 'declined', label: 'Decline' }, { value: '', label: 'Reply' }] },
    ] },
    '/actions': [
      { id: 'act-0001', created_at: iso(29), project: 'life', kind: 'money', gated: true,
        state: 'dismissed', thread_id: TRIP,
        outcomes: [{ value: 'approved', label: 'Approve' }, { value: 'denied', label: 'Deny' }, { value: '', label: 'Reply' }],

      { id: 'act-0002', created_at: iso(23), project: 'life', kind: 'money', gated: true,
        state: 'proposed', thread_id: TRIP,
        outcomes: [{ value: 'approved', label: 'Approve' }, { value: 'denied', label: 'Deny' }, { value: '', label: 'Reply' }],
        title: 'Book the cabin: $480 for two nights',
        detail: 'Two nights, refundable until a week before.\n\n- Sleeps four\n- 40 minutes from the trailhead\n- Paid by the card you named at setup',
        exec_type: 'claude', exec_payload: { project: 'life', prompt: 'Book the lake cabin and add both nights to the calendar.' } },
      { id: 'act-0003', created_at: iso(96), project: 'life', kind: 'commit', gated: true,
        state: 'proposed', thread_id: TIDY,
        outcomes: [{ value: 'approved', label: 'Approve' }, { value: 'denied', label: 'Deny' }, { value: '', label: 'Reply' }],

        detail: 'The week boundary is inclusive at both ends, so Sunday lands in two digests.',

      horizon: 'year', cadence: 'weekly', note_count: 12, last_reviewed_at: iso(700), sources: 'fitness',
      statement: 'Three workouts a week, protein at every meal. The weekly check-in reads the workout and meal logs.' },

      overdue: [{ id: 'cal-0001', ref: 'cal:cal-0001', day: '2026-08-21', kind: 'owner', state: 'fired', title: 'Renew the passport', detail: 'Form and photo are in the drawer', overdue: true }],
      days: [
        { day: '2026-08-25', entries: [{ id: 'cal-0002', ref: 'cal:cal-0002', day: '2026-08-25', at: '07:00', kind: 'owner', state: 'scheduled', title: 'Workout: legs', detail: '45 minutes.', goal_id: 'get-stronger' }] },
        { day: '2026-08-27', entries: [{ id: 'cal-0003', ref: 'cal:cal-0003', day: '2026-08-27', kind: 'agent', state: 'scheduled', title: 'Re-check the digest dates', detail: 'Confirm Sunday is counted once.', thread_id: TIDY }] },
      ],
      anytime: [{ id: 'ask:ask-1a2b', day: '', kind: 'ask', state: 'scheduled', title: 'Make a weather API key', ask_id: 'ask-1a2b', thread_id: TIDY }],
      away: [{ id: 'away-0000feed', title: 'Trip', detail: 'Three days away', from: '2026-08-26', until: '2026-08-28', state: 'on' }],
    },
    '/status': { ok: true, jobs: 2, pending_actions: 2, quiet: true },
  };

  // /spend/summary → shared/fixtures/spend_summary.json
  function shared(clean) {
    if (!FIXDIR) return undefined;
    try {
      const x = new XMLHttpRequest();
      const named = NAMED.find(([re]) => re.test(clean));
      x.open('GET', `${FIXDIR}/${named ? named[1] : clean.replace(/^\//, '').split('/').join('_')}.json`, false);
      x.send();
      if (x.responseText) return JSON.parse(x.responseText);
    } catch (e) { /* no fixture for this route */ }
    return undefined;
  }

  function fixture(path) {
    if (FIX[path]) return FIX[path];
    const clean = path.split('?')[0];
    if (FIX[clean]) return FIX[clean];
    const s = shared(clean);
    if (s !== undefined) return s;
    const keys = Object.keys(FIX).sort((a, b) => b.length - a.length);
    for (const k of keys) if (clean === k || clean.startsWith(k + '/')) return FIX[k];
    for (const k of keys) if (clean.startsWith(k)) return FIX[k];
    return [];
  }

  // Every request is answered locally: the preview can never write to the hub.
  window.fetch = async (url, opts = {}) => {
    const p = String(url).replace(/^.*\/api\/v1/, '');
    const body = (opts.method && opts.method !== 'GET') ? { ok: true } : fixture(p);
    return new Response(JSON.stringify(body), { status: 200, headers: { 'Content-Type': 'application/json' } });
  };
  // A thrown render is otherwise invisible in a screenshot ("Couldn't load
  // sessions" says nothing about where): print it in the corner, and in the
  // DOM for `--dump-dom`.
  const showErr = e => {
    const box = document.getElementById('preview-err') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'preview-err', style: 'position:fixed;bottom:0;left:0;right:0;margin:0;padding:8px;background:#fee;color:#900;font:12px monospace;white-space:pre-wrap;z-index:99' }));
    box.textContent += (e.reason ? (e.reason.stack || e.reason.message || e.reason) : (e.error && e.error.stack) || e.message) + '\n';
  };
  window.addEventListener('error', showErr);
  window.addEventListener('unhandledrejection', showErr);
  const cerr = console.error.bind(console);
  console.error = (...a) => { cerr(...a); showErr({ message: a.map(x => (x && x.stack) || String(x)).join(' ') }); };
  if (!location.hash) location.hash = '#/sessions';
  // &open=1 — expand every <details> before the screenshot, so a collapsed
  // editor or activity block can be looked at too.
  if (params.get('open')) setInterval(() => document.querySelectorAll('details').forEach(d => { d.open = true; }), 250);
  document.write(`<link rel="stylesheet" href="${WEB}/app.css">`);
  document.write(`<link rel="stylesheet" href="${WEB}/skin.css">`);
  document.write(`<scr` + `ipt src="${WEB}/skin.js"></scr` + `ipt>`);
</script>
</head>
<body>

  </div>

  <div id="conn" class="conn"></div>
</nav>
<main id="view"></main>
<div id="toast"></div>
<!-- Same files, same order as hub/internal/server/web/index.html. -->
<script>
  // Drifting from index.html is this page's own failure mode: a script
  // missing here reads "Couldn't load sessions" for every chat.
  for (const f of ['ui.js', 'tip.js', 'places.js', 'composer.js', 'views/asks.js', 'views/threads.js',
                   'views/calgrid.js', 'views/calendar.js', 'views/spend.js', 'views/goals.js', 'views/recs.js',
                   'views/config.js', 'views/sources.js', 'views/runs.js', 'app.js']) {
    document.write(`<scr` + `ipt src="${WEB}/${f}"></scr` + `ipt>`);
  }
</script>
</body>
</html>
